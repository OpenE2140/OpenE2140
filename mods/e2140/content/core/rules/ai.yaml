Player:
	ModularBot@HardAI:
		Name: bot-hard.name
		Type: hard
	ModularBot@CheatingAI:
		Name: bot-cheating.name
		Type: cheating
	GrantConditionOnBotOwner@HardAI:
		Condition: enable-hard-ai
		Bots: hard
	GrantConditionOnBotOwner@CheatingAI:
		Condition: enable-cheating-ai
		Bots: cheating

	GrantConditionOnRushProtection:
		Condition: rush-protection-active

	EconomyManagerBotModule@HardAI:
