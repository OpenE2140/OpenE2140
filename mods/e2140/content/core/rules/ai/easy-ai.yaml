Player:
	ModularBot@EasyAI:
		Name: bot-easy.name
		Type: easy
	GrantConditionOnBotOwner@EasyAI:
		Condition: enable-easy-ai
		Bots: easy

	EconomyManagerBotModule@EasyAI:
		RequiresCondition: enable-easy-ai
		CrateTransporterTypes: shared_vehicles_bantha, shared_aircrafts_heavy_lifter
		RefineryTypes: shared_buildings_refinery
		MineTypes: shared_buildings_mine
		MinimumResourceCellsToDeploy: 5
		MaxResourceCellSearchRadius: 15
		MaxRefineryDistance: 25
		CrateTransporterPerRefineryMinePair: 2
		EconomyExpansionDelays: 2500, 2500, 3500

	ResearchBotModule@EasyAI:
		RequiresCondition: enable-easy-ai
		ResearchDelay: 150

	BaseMcuBuilderBotModule@EasyAI:
