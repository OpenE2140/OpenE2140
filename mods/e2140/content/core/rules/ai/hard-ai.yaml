Player:
	ModularBot@HardAI:
		Name: bot-hard.name
		Type: hard
	GrantConditionOnBotOwner@HardAI:
		Condition: enable-hard-ai
		Bots: hard

	EconomyManagerBotModule@HardAI:
		RequiresCondition: enable-hard-ai
		CrateTransporterTypes: shared_vehicles_bantha, shared_aircrafts_heavy_lifter
		RefineryTypes: shared_buildings_refinery
		MineTypes: shared_buildings_mine
		MinimumResourceCellsToDeploy: 4
		MaxRefineryDistance: 25
		MaxResourceCellSearchRadius: 25
		CrateTransporterPerRefineryMinePair: 2
		EconomyExpansionDelays: 1500, 1500, 1500, 1500, 2000, 2000, 2000
		ExtraExpansionDelay: 5000
		ExtraExpansionMaxIncome: 50000

	ResearchBotModule@HardAI:
		RequiresCondition: enable-hard-ai
		ResearchDelay: 20

	# Hard and Cheating AI currently share same config for these modules:
	# - BaseMcuBuilderBotModule
	# - SquadManagerBotModule
	# - UnitBuilderBotModule
	BaseMcuBuilderBotModule@HardAI:
		RequiresCondition: enable-hard-ai || enable-cheating-ai
		MinimumExcessPower: 0
		MaximumExcessPower: 500
		ExcessPowerIncrement: 200
		ExcessPowerIncreaseThreshold: 4
		MaximumUndeployedMcu: 1
		PowerTypes: shared_mcu_power_plant, shared_mcu_power_plant_upgraded
		ResearchCenterTypes: shared_mcu_research_center
		ProductionTypes: ed_mcu_bio_center, ucs_mcu_robot_factory, ucs_mcu_heavy_tech, ed_mcu_tech_house, shared_mcu_air_base
		BuildingQueues: Building.ED, Building.UCS
		DefenseQueues: Defense.ED, Defense.UCS
		McuFractions:
			ucs_mcu_prod_center: 1
			ucs_mcu_pb_control: 1
			ucs_mcu_robot_factory: 1
			ucs_mcu_heavy_tech: 1
			ed_mcu_bcc: 1
			ed_mcu_bio_center: 1
			ed_mcu_constr_center: 1
			ed_mcu_tech_house: 1
			shared_mcu_air_base: 1
			shared_mcu_research_center: 1
			ucs_mcu_pb_cannon: 1
			ed_mcu_silo: 1
			ed_mcu_an_center: 1
			ed_mcu_defense_tower: 2
			ed_mcu_defense_tower_upgraded: 2
			ed_mcu_heavy_defense_tower: 6
			ed_mcu_heavy_defense_tower_upgraded: 1
			ed_mcu_pillbox: 1
			ucs_mcu_little_eye: 2
			ucs_mcu_little_eye_upgraded: 2
			ucs_mcu_big_eye: 6
			ucs_mcu_big_eye_upgraded: 1
		McuLimits:
			ucs_mcu_pb_cannon: 2
			ed_mcu_silo: 2
			ucs_mcu_sdi_defense: 1
			ucs_mcu_robot_factory: 2
			ed_mcu_bio_center: 2
			ed_mcu_tech_house: 2
			ucs_mcu_heavy_tech: 2
			shared_mcu_air_base: 2
			shared_mcu_research_center: 1
		McuDelays:
			ucs_mcu_pb_control: 12000
			ed_mcu_bcc: 12000

	ResearchBotModule@CheatingAI:
		RequiresCondition: enable-cheating-ai
		ResearchDelay: 0

	SquadManagerBotModule@HardAI:
		RequiresCondition: (enable-hard-ai || enable-cheating-ai) && !rush-protection-active
		SquadSize: 8
		SquadSizeRandomBonus: 40
		ExcludeFromSquadsTypes: ucs_mcu_prod_center, ucs_mcu_pb_control, ucs_mcu_robot_factory, ucs_mcu_teleport, ucs_mcu_heavy_tech, ed_mcu_bcc, ed_mcu_bio_center, ed_mcu_constr_center, ed_mcu_tech_house, shared_mcu_air_base, shared_mcu_mine, shared_mcu_power_plant, shared_mcu_power_plant_upgraded, shared_mcu_refinery, shared_mcu_research_center, shared_mcu_water_base, ucs_mcu_pb_cannon, ed_mcu_silo, ucs_mcu_sdi_defense, ed_mcu_an_center, ed_mcu_defense_tower, ed_mcu_defense_tower_upgraded, ed_mcu_heavy_defense_tower, ed_mcu_heavy_defense_tower_upgraded, ed_mcu_pillbox, ucs_mcu_big_eye, ucs_mcu_big_eye_upgraded, ucs_mcu_little_eye, ucs_mcu_little_eye_upgraded, shared_vehicles_bantha, shared_aircrafts_heavy_lifter, ucs_vehicles_miner_bt, ed_vehicles_miner, ucs_vehicles_goliath, ucs_infantry_silver_t, ucs_ships_ttre400
		ConstructionYardTypes: shared_buildings_power_plant, ed_buildings_constr_center, ucs_buildings_prod_center
		AirUnitsTypes: ed_aircrafts_thunder, ed_aircrafts_storm, ed_aircrafts_vtol, ed_aircrafts_nemezis, ucs_aircrafts_gargoil, ucs_aircrafts_gargoil_ii, ucs_aircrafts_hellwind
		NavalUnitsTypes: ed_ships_shark, ed_ships_kt30, ucs_ships_russ3, ucs_ships_orca
		ProtectionTypes: shared_buildings_power_plant, shared_buildings_research_center, shared_buildings_air_base, shared_buildings_mine, shared_buildings_refinery, shared_buildings_water_base, ed_buildings_constr_center, ed_buildings_tech_house, ed_buildings_bio_center, ed_buildings_bcc, ucs_buildings_prod_center, ucs_buildings_heavy_tech, ucs_buildings_robot_factory, ucs_buildings_teleport, ucs_buildings_pb_control
		NavalProductionTypes: shared_buildings_water_base_dock

