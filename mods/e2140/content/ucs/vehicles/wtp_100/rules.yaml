ucs_vehicles_wtp_100:
	Inherits: ^UcsVehicle
	Inherits: ^AutoTargetAll
	Tooltip:
		Name: WTP 100
	Valued:
		Cost: 1000
	Buildable:
		IconPalette:
		Queue: Vehicle.UCS, Teleport.UCS
		BuildDuration: 100
		BuildPaletteOrder: 90
		Prerequisites: NuclearEngine
		Description: General-purpose transport.\nCarries infantry and vehicles.\nCan travel on water.\nUnarmed.
	Selectable:
		Bounds: 1664, 1472, 0, 0
	Health:
		HP: 300
	Mobile:
		Locomotor: vehicleWtp100
		Speed: 90
	RevealsShroud:
		Range: 2c896
	WithMoveSound:
		Sound: 31.smp
	# WTP 100 doesn't have move animation.
	-WithMoveAnimation:
	SpawnActorOnDeath:
		Actor: ucs_vehicles_wtp_100_husk
	# Don't count WTP 100 as army in the player statistics.
	UpdatesPlayerStatistics:
		AddToArmyValue: false
	AttachedCargo:
		Types: Infantry, Vehicle
		MaxWeight: 6
		UnloadVoice: Unload
		UnloadCursor: exit
		ZOffset: 64
		LoadedCondition: PassengersLoaded
		PassengerConditions:
			ucs_vehicles_shadow: ShadowPassengerLoaded
			ucs_vehicles_detector: DetectorPassengerLoaded
	AutoTarget:
		RequiresCondition: PassengersLoaded
		AttackAnythingCondition: stance-attackanything
		MinimumScanTimeInterval: 5
		MaximumScanTimeInterval: 15
	
	AttackAttachedCargo:
		RequiresCondition: PassengersLoaded
		Voice: Attack

	# AttachedCargo trait is very hacky and Shadow's cloaking ability breaks in many situations.
	# Therefore when Shadow is loaded, WTP 100 takes over the cloaking ability.
	ProximityExternalCondition:
		RequiresCondition: ShadowPassengerLoaded
		Condition: shadowcloak
		Range: 4c896
		AffectsParent: true
	# Same hack as above needs to be applied to cloak detection.
	DetectCloaked:
		RequiresCondition: DetectorPassengerLoaded
		DetectionTypes: Cloak, UnderwaterCloak
		Range: 4c896
	WithCargoPipsDecoration:
		Palette:
		FullSequence: pip-blue
		PipStride: 6,0
		Margin: 5,10
		Position: TopLeft
		RequiresSelection: true
	-Passenger:
	Encyclopedia:
		Category: UCS - Vehicles
		Order: 12
		Animation: DATABASE/BT12.FLC
		Title: WTP 100 - Air-cushion Transporter
		Armor: medium
		Armament: none
		Description: The WTP 100 is an unarmed, amphibious air-cushion transporter with two conventional forms of impulsion giving it medium levels of speed on both land and water.\nThe WTP transports up to six small battle or five small units and a vehicle.\nBut you must load the lightweight battle units first.\nThe weapons of any vehicle being transported by the WTP 100 are fully functional.

# WTP 100 has special locomotor as it can move on water.
# In E2140 however, it has slighly lower speed on sand.
^CoreWorld:
	Locomotor@vehicleWtp100:
		Name: vehicleWtp100
		Crushes: infantry, mine, husk
		CrushDamageTypes: Crush
		TerrainSpeeds:
			Clear: 100
			Creek: 100
			Sand: 90
			SandEdge: 90
			Road: 100
			AsphaltRoad: 100
			Water: 100
			Shore: 100
			Resources: 100

ucs_vehicles_wtp_100_husk:
	Inherits@1: ^Husk
	Inherits@2: ^HuskBurnsBigFire
	Tooltip:
		Name: Husk (WTP 100)
